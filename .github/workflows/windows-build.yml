# Builds the Windows installer for a release. The local machine only runs
# source checks and Python tests; the EXE is always built here.
name: Windows build

on:
  push:
    branches: [main]
    # The installer embeds the relay and web sources too: a change to either
    # must rebuild it, otherwise the artifact installs yesterday's pages.
    paths: ["agent-windows/**", "relay/**", "web/**", "tools/package_windows.py", ".github/workflows/windows-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the installer
        run: python tools/package_windows.py
      - name: Verify the installer matches the sources
        shell: bash
        run: |
          version=$(grep -m1 'VERSION = ' tools/package_windows.py | sed 's/.*"\(.*\)".*/\1/')
          test -f "dist/RemoteCli-Setup-$version.exe"
          grep -q "Version = \"$version\"" agent-windows/RemoteCliApp.cs
          grep -q "Version = \"$version\"" agent-windows/Setup.cs
          grep -q "VERSION = \"$version\"" relay/server.py
          grep -q "android:versionName=\"$version\"" android/AndroidManifest.xml
          grep -q "MARKETING_VERSION: \"$version\"" ios/project.yml
          build=$(grep -m1 'android:versionCode=' android/AndroidManifest.xml | sed 's/.*versionCode="\([0-9]*\)".*/\1/')
          grep -q "CURRENT_PROJECT_VERSION: \"$build\"" ios/project.yml
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteCli-Windows
          path: dist/RemoteCli-Setup-*.exe
          if-no-files-found: error
