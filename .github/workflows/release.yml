name: Release

# Fork-local release automation. Per the maintainer's model this repo's released
# artifacts are built on the machine and published by hand; CI drafts are a convenience.
# The signing key comes from repository secrets — never from an Actions cache, where
# eviction would silently mint a new key and break in-app updates on installed phones.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: compile with the in-box .NET Framework compiler
        run: powershell -ExecutionPolicy Bypass -File agent-windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: agent-windows/bin/*.exe
          if-no-files-found: error

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: accept licenses and install the SDK pieces the build needs
        shell: pwsh
        run: |
          "y`r`n" * 50 | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --licenses *> $null
          & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "build-tools;36.0.0" "platforms;android-36" | Out-Null
      - name: restore the signing key from the repository secrets
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_B64 -or -not $env:KEYSTORE_PASSWORD) {
            Write-Error "ANDROID_SIGNING_KEYSTORE_B64 / ANDROID_SIGNING_PASSWORD are not set; refusing to sign with a throwaway key that would silently break in-app updates"
            exit 1
          }
          New-Item -ItemType Directory -Force ~\.remote-cli-signing | Out-Null
          [IO.File]::WriteAllBytes("$HOME\.remote-cli-signing\signing.p12", [Convert]::FromBase64String($env:KEYSTORE_B64))
          [IO.File]::WriteAllText("$HOME\.remote-cli-signing\signing-password.txt", $env:KEYSTORE_PASSWORD)
      - name: build the APK
        run: powershell -ExecutionPolicy Bypass -File android\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect files and write checksums
        run: |
          mkdir release
          find artifacts -type f -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt
      - name: create a draft release for the tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*
